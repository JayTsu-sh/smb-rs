[package]
name = "smb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
smb-msg = { workspace = true }
smb-dtyp = { workspace = true }
smb-rpc = { workspace = true }
smb-fscc = { workspace = true }
smb-transport = { workspace = true }

# Zero-copy buffers
bytes = { workspace = true }

# Encoding/Decoding
binrw = { workspace = true }
modular-bitfield = { workspace = true }

# Async
tokio = { workspace = true, features = ["time", "rt", "sync", "io-util"] }
futures = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = { workspace = true }

# General utils
rand = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
pastey = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
# Stable keyed hash used to derive per-path lease keys from the client's
# random salt. std::DefaultHasher's algorithm is explicitly unstable
# across Rust versions, which would break lease-cache reuse across
# rustc upgrades for callers that pin lease_key_salt.
siphasher = "1"

url = "2.5.0"
byteorder = { version = "1.5.0", optional = true }
# Lock-free atomic Arc swap used for the set-once channel slot inside
# SessionAndChannel: avoids an outer RwLock that every encrypt / sign
# path would otherwise traverse.
arc-swap = "1"

# APIs
sspi = { version = "0.21.3", features = ["ring"], default-features = false }
zeroize = "1"
reqwest = { workspace = true, optional = true }

# Crypto
hmac = "0.13"
sha2 = "0.11"
kbkdf = { version = "0.1.0-rc.1" }
crypto-common = { version = "0.2" }
aes = "0.9"
aes-gcm = { version = "0.11", optional = true }
cmac = { version = "0.8", optional = true }
ccm = { version = "0.6", optional = true }
aead = { version = "0.6", optional = true }

# Compression
lz4_flex = { version = "0.11", default-features = false, features = [
    "std",
], optional = true }

# Dev - Tests
[dev-dependencies]
test-log = { version = "0.2", default-features = false, features = ["trace"] }
serial_test = "3.2"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "test-util", "time"] }
serde_json = "1"
smb-tests = { workspace = true }

[[test]]
name = "conformance_anonymous"
required-features = ["test-support"]

[[test]]
name = "conformance_smb302"
required-features = ["test-support"]

[[test]]
name = "conformance_smoke"
required-features = ["test-support"]

[[test]]
name = "conformance_windows_dc_ntlm"
required-features = ["test-support"]

[[test]]
name = "lifecycle_scenario"
required-features = ["test-support"]

[[test]]
name = "signing_policy_live"
required-features = ["real-server-tests"]

[[test]]
name = "ontap_performance"
required-features = ["real-server-tests"]

[[test]]
name = "transform_copy_budget"
required-features = ["compress"]

[features]
default = ["sign", "encrypt", "netbios-transport"]

# Compression
compress_pattern_v1 = []
compress_lz4 = ["dep:lz4_flex"]
compress = ["compress_pattern_v1", "compress_lz4"]

# Encryption
__encrypt_core = []
encrypt_aes128ccm = ["dep:ccm", "dep:aead", "__encrypt_core"]
encrypt_aes256ccm = ["dep:ccm", "dep:aead", "__encrypt_core"]
encrypt_aes128gcm = ["dep:aes-gcm", "dep:aead", "__encrypt_core"]
encrypt_aes256gcm = ["dep:aes-gcm", "dep:aead", "__encrypt_core"]
encrypt_aesccm = ["encrypt_aes128ccm", "encrypt_aes256ccm"]
encrypt_aesgcm = ["encrypt_aes128gcm", "encrypt_aes256gcm"]
encrypt = ["encrypt_aesccm", "encrypt_aesgcm"]

# Signing
sign_gmac = ["dep:aes-gcm"]
# The compatibility feature uses the portable RustCrypto backend. Its runtime
# batches independent CMAC chains so production does not depend on AES-NI.
sign_cmac = ["sign_cmac_rustcrypto"]
sign_cmac_rustcrypto = ["dep:cmac"]
sign_hmac = []
sign = ["sign_gmac", "sign_cmac", "sign_hmac"]

# Transport
netbios-transport = ["smb-transport/netbios-transport"]

# Kerberos requires reqwest for HTTP transport, for kerberos
kerberos = ["reqwest", "dep:byteorder"]

# Test-only API surface: exposes session-setup internals (GssState,
# authenticate_with_gss) and pulls in the smb-msg `server` feature so
# integration tests can construct server-direction frames (e.g. a
# scripted NegotiateResponse) via BinWrite. Never enable in production
# — the re-exported items are not subject to SemVer.
test-support = ["smb-msg/server", "smb-transport/test-support", "dep:serde"]
real-server-tests = []

[package.metadata.docs.rs]
features = ["sign", "encrypt", "compress", "kerberos"]
no-default-features = true
