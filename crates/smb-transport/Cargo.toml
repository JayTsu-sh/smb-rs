[package]
name = "smb-transport"
description = "SMB Transport implementations for `smb-rs`"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
smb-dtyp = { workspace = true }

bytes = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net", "macros", "io-util", "time"] }
tokio-util = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }

binrw = { workspace = true }
modular-bitfield = { workspace = true }
time = { workspace = true }
pastey = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
smb-tests = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "scripted_transport"
required-features = ["test-support"]

[features]
default = ["netbios-transport"]

netbios-transport = []
test-support = []
